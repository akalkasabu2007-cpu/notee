
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>
    <h1>WRITE YOUR THOUGHTS</h1>
    <h2>Create Notepad</h2>
    <a href="{% url 'create' %}">create</a>
    <h2>Update Notepad</h2>
    {% for i in item %}
        <p>{{ i.Title }} - {{ i.Description }}</p>
        <button type="submit"><a href="{% url 'update' i.id %}">update</a></button>
        <button type="submit"><a href="{% url 'delete' i.id %}">delete</a></button>
    {% endfor %}
        <button type="submit"><a href="{% url 'logout' %}">Logout</a></button>
</body>
</html>
